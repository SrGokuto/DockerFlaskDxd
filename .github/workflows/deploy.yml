name: Publicar Imagen en Docker Hub

on:
  push:
    branches: ["main", "feature/*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --upgrade "wheel>=0.46.2"
          pip install -r requirements.txt
          pip install pytest bandit

      - name: Ejecutar análisis de seguridad con Bandit
        run: |
          bandit -r . -s B101

      - name: Ejecutar pruebas unitarias
        run: |
          pytest --maxfail=1 --disable-warnings -q
          
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/mi-app-flask:latest

      - name: Escanear contenedor con trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/mi-app-flask:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Subir la imagen a docker hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/mi-app-flask:latest
        
      - name: Desplegar en el servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with: 
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_ADMIN }}
          key:  ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/DockerFlaskDxd
            docker compose pull app-backend
            docker compose up -d