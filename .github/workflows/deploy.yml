name: Publicar Imagen en Docker Hub

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/mi-app-flask:latest
      - name: Desplegar en el servidor cloud
        uses: appleboy/ssh-action
        with: 
          host: ${{ secrets.SERVER_HOST }}
          name: ${{ secrets.SERVER_ADMIN }}
          key:  ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/DockerClaseDxd
            docker compose pull app-backend
            docker compose up -d